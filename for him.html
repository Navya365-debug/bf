<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirf tumhara haath 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#fff1f4;
    --night2:#ffe0e8;
    --gold:#c2185b;
    --rose:#f48fb1;
    --ivory:#4a1226;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:var(--night);
    color:var(--ivory);
    line-height:1.7;
    overflow-x:hidden;
  }
  h1,h2,.shayari{font-family:'Playfair Display',Georgia,serif;font-weight:500}
  section{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:64px 24px;
    position:relative;
  }
  section:nth-of-type(even){background:var(--night2)}
  h1{font-size:clamp(2.2rem,8vw,4.2rem);line-height:1.25;max-width:14em}
  h2{font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:20px}
  p{max-width:32em;font-size:1.1rem;opacity:.92}
  .sub{margin-top:18px;color:var(--gold)}

  button{
    font-family:inherit;font-size:1.05rem;font-weight:600;
    background:var(--gold);color:#fff;
    border:none;border-radius:999px;
    padding:14px 30px;margin-top:30px;cursor:pointer;
    transition:transform .15s, background .2s;
  }
  button:hover{transform:scale(1.05)}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
  button.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold)}

  /* hands */
  .hands{display:flex;align-items:center;justify-content:center;height:140px;margin:10px 0;font-size:5.5rem}
  .hands span{display:inline-block;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
  #handL{transform:translateX(-90px)}
  #handR{transform:translateX(90px)}
  .hands.joined #handL{transform:translateX(14px)}
  .hands.joined #handR{transform:translateX(-14px)}
  #handLine{min-height:3.2em;margin-top:12px;color:var(--gold);font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.5rem;opacity:0;transition:opacity 1s .9s}
  .hands.joined ~ #handLine{opacity:1}

  /* shayari */
  .shayari-box{
    min-height:190px;max-width:26em;
    border-left:3px solid var(--rose);
    padding:8px 0 8px 22px;margin-top:10px;text-align:left;
  }
  .shayari{font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.9;white-space:pre-line;transition:opacity .4s}

  /* photos */
  .photos{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  figure{width:min(300px,80vw)}
  .frame{
    aspect-ratio:3/4;border-radius:6px;overflow:hidden;
    background:#fff;padding:10px 10px 0;
    box-shadow:0 14px 40px rgba(194,24,91,.25);
  }
  .frame:nth-child(odd){transform:rotate(-2deg)}
  figure:nth-child(2) .frame{transform:rotate(2.5deg)}
  .frame img{width:100%;height:calc(100% - 10px);object-fit:cover;display:block;border-radius:2px}
  figcaption{margin-top:16px;color:var(--gold);font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.15rem}

  /* final */
  .btn-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:90px;position:relative}
  #final{display:none;margin-top:28px}
  #final h2{color:var(--gold)}

  .heart{position:fixed;pointer-events:none;z-index:50;animation:rise 2.6s ease-out forwards}
  @keyframes rise{
    from{opacity:1;transform:translateY(0) scale(.6)}
    to{opacity:0;transform:translateY(-70vh) scale(1.3)}
  }
  @media (prefers-reduced-motion:reduce){
    .hands span{transition:none}
    .heart{animation-duration:.01s}
  }
</style>
</head>
<body>

<!-- 1. Hero -->
<section id="hero">
  <h1>Happy Boyfriend's Day, <span id="bfName">baby</span> 🤍</h1>
  <p class="sub">Aaj ka din tumhara hai. Aur ye page bhi.</p>
  <button onclick="go('hands')">Kholo</button>
</section>

<!-- 3. Hands -->
<section id="hands">
  <h2>Mujhe bas itna kehna hai…</h2>
  <div class="hands" id="handsBox">
    <span id="handL">🫱</span><span id="handR">🫲</span>
  </div>
  <div id="handLine">Mujhe sirf tum chahiye.</div>
  <button id="holdBtn" onclick="holdHands()">Paas aao</button>
</section>

<!-- 4. Shayari -->
<section id="shayari">
  <h2>Tumhare liye, kuch lines</h2>
  <div class="shayari-box"><div class="shayari" id="shayariText">Neeche button dabao…</div></div>
  <button onclick="nextShayari()" id="shBtn">Ek shayari suno</button>
</section>

<!-- 6. Ask -->
<section id="ask">
  <h2 id="askTitle">Kya tum hamesha mere saath rahoge?</h2>
  <div class="btn-row" id="btnRow">
    <button id="yesBtn" onclick="sayYes()">Haan 🤍</button>
    <button id="noBtn" class="ghost" onmouseover="dodge()" ontouchstart="dodge(event)" onclick="dodge()">Nahi</button>
  </div>
  <div id="final">
    <h2>Yes! 🤍</h2>
    <p>Happy Boyfriend's Day. Main har jagah, har waqt, sirf tumhari hoon.</p>
  </div>
</section>

<script>
  /* ====== Yahan apna badlav karo ====== */
  const HIS_NAME = "baby";      // Uska naam ya nickname yahan likho
  const SHAYARIS = [
    "Bheed mein hazaar chehre mile,\npar ghar jaisa sukoon\nbas tum mein mila.",
    "Duniya mein log bahut hain,\npar jisse dil ko fark padta hai,\nwoh sirf tum ho.",
    "Tum saath ho,\ntoh darr chhota lagta hai\naur khwaab bade.",
    "Zindagi ke har mod par\nbas ek hi dua hai,\ntumhara saath kabhi na chhute.",
    "Main kisi aur ki ho hi nahi sakti,\nmera har raasta\ntum tak aakar rukta hai."
  ];
  /* ================================== */

  document.getElementById('bfName').textContent = HIS_NAME;

  function go(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

  function fallback(){
    // photo na mile to yeh placeholder dikhega
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='100%' height='100%' fill='#f6e3e8'/><text x='50%' y='50%' font-size='48' text-anchor='middle'>🤍</text></svg>";
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  function hearts(n, x, y){
    for(let i=0;i<n;i++){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['🤍','❤️','🩷'][i%3];
      h.style.left = (x ?? Math.random()*window.innerWidth) + (Math.random()*80-40) + 'px';
      h.style.top  = (y ?? window.innerHeight-60) + 'px';
      h.style.fontSize = (18 + Math.random()*22) + 'px';
      h.style.animationDelay = (Math.random()*0.6) + 's';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 3600);
    }
  }

  function holdHands(){
    document.getElementById('handsBox').classList.add('joined');
    document.getElementById('holdBtn').style.display = 'none';
    setTimeout(()=>hearts(14), 1300);
    setTimeout(()=>{
      const b = document.createElement('button');
      b.textContent = 'Aage chalo';
      b.onclick = ()=>go('shayari');
      document.getElementById('hands').appendChild(b);
    }, 1800);
  }

  let sIdx = -1;
  function nextShayari(){
    sIdx = (sIdx + 1) % SHAYARIS.length;
    const el = document.getElementById('shayariText');
    el.style.opacity = 0;
    setTimeout(()=>{ el.textContent = SHAYARIS[sIdx]; el.style.opacity = 1; }, 300);
    document.getElementById('shBtn').textContent = 'Aur ek';
    if(sIdx === SHAYARIS.length-1){
      setTimeout(()=>{
        if(!document.getElementById('toPhotos')){
          const b = document.createElement('button');
          b.id='toPhotos'; b.className='ghost'; b.textContent='Photos dekho';
          b.onclick = ()=>go('photos');
          document.getElementById('shayari').appendChild(b);
        }
      }, 600);
    }
  }

  // "Nahi" button bhaagta hai
  function dodge(e){
    if(e && e.preventDefault) e.preventDefault();
    const btn = document.getElementById('noBtn');
    btn.style.position = 'fixed';
    const maxX = window.innerWidth - btn.offsetWidth - 20;
    const maxY = window.innerHeight - btn.offsetHeight - 20;
    btn.style.left = Math.max(10, Math.random()*maxX) + 'px';
    btn.style.top  = Math.max(10, Math.random()*maxY) + 'px';
  }

  function sayYes(){
    document.getElementById('btnRow').style.display = 'none';
    document.getElementById('askTitle').style.display = 'none';
    document.getElementById('final').style.display = 'block';
    hearts(40);
    setTimeout(()=>hearts(30), 900);
  }
</script>
</body>
</html>
